# 双目相机标定生产工具的唯一参数来源(D-10)
#
# 硬性规则:
# - 命令行不接受任何算法参数(仅可选 --config 指定本文件路径),所有默认值集中在本文件;
# - 换数据集/换棋盘规格只改配置不改代码。

# ---- 标定板规格(全局)----
board:
  board_type: "chessboard"             # 当前只支持棋盘格
  cols: 11                             # 内部角点列数
  rows: 8                              # 内部角点行数,11×8 = 88 个内部角点
  square_size_mm: 25.0                 # 方格物理边长(决定外参平移尺度,不影响内参)
  unit: "mm"

# ---- 数据位置(相对当前工作目录)----
data:
  train: "data/train"                  # 训练图像:双层嵌套 <ts>/<ts>_<us>/cam{1,2}.jpg
  test: "data/test"                    # 测试图像:同结构

# ---- 输出(D-11)----
output_root: "output"                  # 固定根目录,每次运行直接写入覆盖,不做时间戳版本化;
                                       # 与 data/ 相等或互相包含的配置会在加载层被拒绝(防误删数据)

# ---- 全局 ----
cv2_threads: 0                         # OpenCV 内部线程数;0 = 关闭 OpenCV 自己的多线程,
                                       # 防止批量处理时占满所有核(并行交给上层显式控制)

# ---- 模块1:数据预处理(角点检测与筛选)----
preprocess:
  max_workers: 12                      # 并行进程数;1 = 串行调试(体例照参考工程)
  corners:
    # 经典检测器 findChessboardCorners 的选项(按名字开,代码内翻译成 cv2 常量):
    # adaptive_thresh = 自适应阈值(光照不均时更稳);normalize_image = 先归一化亮度
    classic_flags: [adaptive_thresh, normalize_image]
    sb_flags: 0                        # 新款检测器 findChessboardCornersSB 的选项位掩码,0 = 默认
    # SB 未检出的帧用经典检测器兜底(01-02 接入);每帧来源记在 npz 的 source 数组:
    # "sb" = SB 本体检出,"classic" = SB 未检出、classic 兜底填入,"" = 均未检出
    sb_fallback_classic: true
    subpix:
      # 亚像素精化(仅 classic 路线使用;SB 输出已亚像素,严禁二次精化)窗口粒度:
      # frame = 每帧一个窗口(帧内方格像素边长中位数推导,默认);
      # corner = 逐角点局部自适应(边缘强畸变处方格更小时用)
      window_granularity: frame
      min_win: 3                       # 半窗口下限(像素);窗口绝不允许 >= 方格像素边长(头号陷阱)
      max_iter: 30                     # 精化迭代次数上限
      epsilon: 0.01                    # 收敛容差:角点移动小于此值即停(像素)
  copy_fail_originals: true            # D-02:失败帧原图拷贝到输出目录(fail_ 前缀)供人工复核(01-03 接入)
  visualization:
    jpeg_quality: 90                   # 角点标注图 JPEG 质量(01-03 接入)

# ---- 模块2:单相机内参标定(OpenCV 初值 + scipy 精化 + 离群剔除 + 模型体检)----
intrinsic:
  distortion_model: "M8"               # 畸变模型布局:M2 = 五参 Brown-Conrady(legacy,
                                       # 本相机实测欠拟合——体检 fail-closed 拦截的根因);
                                       # M8 = rational 8(D=[k1,k2,p1,p2,k3,k4,k5,k6],
                                       # 2026-10-24 增补,本相机实测充分)
  refine:
    enabled: true                      # OpenCV 初值之后是否做 scipy 联合精化(算法开关全部配置控制)
    method: "trf"                      # least_squares 求解方法,只收 trf('lm' 只支持稠密雅可比,拒收防呆)
    max_nfev: 300                      # 精化函数求值次数上限(141/155 视图规模实测数十次内收敛,300 留裕量)
    ftol: 1.0e-10                      # 代价函数相对收敛容差(参考工程同数据量级实测收敛组合)
    xtol: 1.0e-12                      # 参数相对收敛容差(压到机器精度量级,保住精化收益)
    gtol: 1.0e-10                      # 梯度无穷范数收敛容差(参考工程同值)
  outlier:
    enabled: true                      # 自动离群剔除开关:逐帧 RMS 超阈 → 剔除 → 重标定(全程留痕进报告)
    rms_multiplier: 5.0                # 判离群阈值:逐帧 RMS > 5×幸存集中位数(中位数基准不受离群自身拖动)
    max_drop_fraction: 0.2             # 保险丝:累计剔除不得超过 20% 帧(防剔除循环吃掉过多视图)
    max_iterations: 3                  # 保险丝:剔除-重标定循环轮数上限(防中位数随剔除漂移不收敛)
    min_views: 10                      # 剔除后幸存视图数下限(低于此数报错不硬算;惯例 ≥10)
  rms_test_max: 1.0                    # test 集整体 RMS 判 PASS/FAIL 阈值(像素;报告按此判,不作硬退出条件)
  exclude_images: []                   # 手动逻辑剔除清单(图像编号列表;与自动机制叠加,原数据不动)
  diagnostics:                         # 模型充分性体检:标定完成后仅凭自家数据+自家结果判内参是否可靠
                                       # (标量 RMS 看不出的 M2 欠拟合——如 cam1 fx 被推高 11%——由体检揪出)
    enabled: true                      # 体检总开关(默认 true;false 时跳过并在报告注明)
    a0_max_ratio: 2.0                  # A0 红:PnP 逐点池化 RMS / 中心桶噪声底 上限(倍;>此值=残差能量集中在边缘)
    a1_max_bin_mean_px: 0.02           # A1 红:残差径向分量按归一化半径 5 桶均值的绝对值上限(px;结构性欠拟合信号)
    a3_max_fx_range_pct: 0.5           # A3 红:6 切片(左右/上下/内外圈)重标 fx 极差上限(%;fx 吸收畸变必随板位漂移)
    a3_min_frames: 20                  # A3 单切片最少帧数(低于则跳过该切片;有效切片 <4 记「数据不足」不计红)
    a4_max_fx_jump_pct: 2.0            # A4 红:全量升阶 rational8 探针重标的 fx 跳变上限(%;跳变大=低阶模型欠拟合实锤)
    min_red_count: 2                   # verdict 判「不可靠」所需最少红灯数(判定规则:A0/A1/A3/A4 任意两项红即 fail-closed)

# ---- 模块3:双目外参标定(消费 Phase 1 对清单/角点 npz + Phase 2 intrinsics.json;固定内参求 R/T)----
stereo:
  refine:
    enabled: true                      # PnP 初值之后是否做 scipy 外参联合精化(成功标准 1 配置控制要求)
    method: "trf"                      # least_squares 求解方法,只收 trf('lm' 只支持稠密雅可比,拒收防呆)
    max_nfev: 200                      # 精化函数求值次数上限(112 对 678 参数规模,200 留裕量)
    ftol: 1.0e-10                      # 代价函数相对收敛容差(Phase 2 同款实测收敛组合)
    xtol: 1.0e-12                      # 参数相对收敛容差(压到机器精度量级,保住精化收益)
    gtol: 1.0e-10                      # 梯度无穷范数收敛容差(Phase 2 同值)
  outlier:
    enabled: true                      # 双目离群对自动剔除开关:逐对 RMS 超阈 → 剔除 → 重解(全程留痕进报告)
    rms_multiplier: 5.0                # 判离群阈值:逐对重投影 RMS > 5×幸存中位数(中位数基准不受离群自身拖动)
    max_drop_fraction: 0.2             # 保险丝:累计剔除不得超过 20% 对(防剔除循环吃掉过多对)
    max_iterations: 3                  # 保险丝:剔除-重解循环轮数上限(防中位数随剔除漂移不收敛)
    min_pairs: 10                      # 剔除后幸存对数下限(低于此数报错不硬算;双目侧对应 intrinsic.outlier.min_views)
  flip_ratio: 0.5                      # 180° 消歧判定阈值:err_rev < 0.5×err_fwd 才翻(参考 05 实测;证据充分才翻,防边界抖动)
  median_spread_max_deg: 1.0           # Rodrigues 中位离散度防线上限(刚架相对位姿跨帧摆动应远小于此,超即中文报错)
  distance_rms_max_mm: 5.0             # test 集对角距离残差 RMS 判 PASS/FAIL 阈值(毫米;报告按此判,不作硬退出条件)
  baseline_band_mm: [20, 2000]         # baseline 量级 sanity 硬带(防 |t|≈2500mm 型灾难;本仓无支架物理记载,可后续收窄)
  exclude_pairs: []                    # 手动逻辑剔除对清单(group_id 列表;与自动机制叠加,原数据不动)
  joint:
    enabled: false                     # 联合 BA 开关,默认 false 且当前不可置 true:引擎(joint.py)已
                                       # 落地,但生产接线(评估链 + 24 键契约)因 03-05 三变体裁决失败
                                       # 按失败协议跳过——置 true 会被 run_stereo 入口 fail-closed 硬门
                                       # 拦截(中文报错、退出码 1),待接线任务落地后才允许打开
    variant: "fc_prior"                # 结构化变体:fc(只放两路 f/c,D 冻结)/ fc_prior(fc + 先验)/
                                       # full_prior(全内参放开 + 先验);约束越强越防内参无界漂移
    prior_weight: 1.0                  # Tikhonov 先验行统一乘子(f/c 相对偏差 + D 绝对偏差拉回)
    spread_ratio_max: 5.0              # 联合解散布防线:精化后逐对 RMS max/median 超此值 → 中文报错(fail-closed)
